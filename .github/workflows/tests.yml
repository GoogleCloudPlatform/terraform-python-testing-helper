name: Python tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  GOOGLE_APPLICATION_CREDENTIALS: "/home/runner/credentials.json"
  PYTEST_ADDOPTS: "--color=yes"
  TF_PLUGIN_CACHE_DIR: "/home/runner/.terraform.d/plugin-cache"

jobs:
  tests:
    name: Python ${{ matrix.python-version }} (${{ matrix.iac }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        iac: ["terraform", "opentofu"]
    steps:
      - uses: actions/checkout@v4

      - name: Config auth
        id: auth
        run: |
          echo '{"type": "service_account", "project_id": "test-only"}' \
            | tee -a $GOOGLE_APPLICATION_CREDENTIALS

      - name: Set up Python
        id: python-setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Terraform
        if: matrix.iac == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: matrix.iac == 'opentofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Run tests
        id: python-test
        run: |
          mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}
          pip install -r DEV-REQUIREMENTS.txt
          if [ "${{ matrix.iac }}" = "opentofu" ]; then
            pytest -vv --tf-binary=tofu
          else
            pytest -vv --tf-binary=terraform
          fi
