[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tftest"
dynamic = ["version"]
description = "Simple Terraform and OpenTofu test helper"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "Ludovico Magnocavallo", email = "ludomagno@google.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/GoogleCloudPlatform/terraform-python-testing-helper"

[tool.setuptools]
py-modules = ["tftest"]

[tool.setuptools.dynamic]
version = { attr = "tftest.__version__" }
